<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Projects — Hamid Ali Asad</title>
  <meta name="description" content="Projects and case studies by Hamid Ali Asad" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root{--text:#0B1B2C;--muted:#6B7280}
    body{font-family:Inter,system-ui,Segoe UI,Roboto,Arial;margin:0;background:#F6F8FA;color:var(--text)}
    a.project{transition:transform .15s ease}
    a.project:hover{transform:translateY(-6px)}
  </style>
</head>
<body>
  <header class="bg-white border-b">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="/" class="font-semibold">Hamid Ali Asad</a>
      <nav class="hidden md:flex gap-4 text-sm text-[color:var(--muted)]">
        <a href="/">Home</a>
        <a href="/content/projects/">MDX files</a>
        <a href="#">Contact</a>
      </nav>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-6 py-10">
    <h1 class="text-3xl font-bold">Projects & Case Studies</h1>
    <p class="text-[color:var(--muted)] mt-2">Click a project to open the scaffolded case study (edit the MDX file in content/projects to update).</p>

    <div id="projects" class="mt-6 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </main>

  <script>
    fetch('/projects.json')
      .then(r => r.json())
      .then(data => {
        const wrap = document.getElementById('projects');
        data.forEach(p => {
          const slug = (p.url||p.title||'').toLowerCase().replace(/https?:\/\//,'').replace(/www\./,'').replace(/[^\w\-]+/g,'-').replace(/\-+/g,'-').replace(/^\-|\-$/g,'');
          const el = document.createElement('a');
          el.className = 'project block p-4 bg-white rounded-lg border';
          el.href = '/projects/' + slug + '.html';
          el.innerHTML = `
            <div class="h-40 mb-3 bg-gray-100 rounded overflow-hidden flex items-center justify-center">
              <img src="/public/thumbnails/${slug}.svg" alt="${p.title}" style="max-width:100%;height:auto;"/>
            </div>
            <div class="font-semibold">${p.title}</div>
            <div class="text-sm text-[color:var(--muted)]">${p.category || ''}</div>
          `;
          wrap.appendChild(el);
        });
      })
      .catch(e => console.error(e));
  </script>
</body>
</html>
